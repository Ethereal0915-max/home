<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>逻辑猜门游戏</title>
<style>
  /* ===== 全局样式 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f7fa;
    color: #2c3e50;
    line-height: 1.6;
    min-height: 100vh;
    padding: 16px;
  }
  .container {
    max-width: 720px;
    margin: 0 auto;
  }
  h1 {
    text-align: center;
    font-size: 1.6rem;
    color: #1a202c;
    margin-bottom: 20px;
    font-weight: 700;
  }

  /* ===== 卡片通用样式 ===== */
  .card {
    background: #ffffff;
    border-radius: 12px;
    padding: 20px;
    margin-bottom: 16px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }
  .card h2 {
    font-size: 1.1rem;
    color: #2d3748;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #edf2f7;
    font-weight: 600;
  }

  /* ===== 游戏说明区 ===== */
  .rules p {
    font-size: 0.92rem;
    color: #4a5568;
    margin-bottom: 6px;
  }
  .rules .highlight {
    color: #d69e2e;
    font-weight: 600;
  }

  /* ===== 状态提示 ===== */
  .status-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 12px;
  }
  .status-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 0.85rem;
    font-weight: 600;
  }
  .tag-questions { background: #ebf8ff; color: #2b6cb0; }
  .tag-phase { background: #f0fff4; color: #2f855a; }
  .tag-phase.locked { background: #fff5f5; color: #c53030; }

  /* ===== 提问选择区 ===== */
  .question-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .select-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .select-row label {
    font-size: 0.9rem;
    color: #4a5568;
    font-weight: 500;
    min-width: 50px;
  }
  select {
    padding: 8px 14px;
    border: 2px solid #e2e8f0;
    border-radius: 8px;
    font-size: 0.95rem;
    background: #fff;
    color: #2d3748;
    cursor: pointer;
    transition: border-color 0.2s;
    min-width: 80px;
  }
  select:focus { outline: none; border-color: #4299e1; }
  select:disabled { background: #f7fafc; cursor: not-allowed; opacity: 0.6; }

  .btn {
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-primary {
    background: #4299e1;
    color: #fff;
  }
  .btn-primary:hover:not(:disabled) { background: #3182ce; transform: translateY(-1px); }
  .btn-success {
    background: #48bb78;
    color: #fff;
  }
  .btn-success:hover:not(:disabled) { background: #38a169; transform: translateY(-1px); }
  .btn-warning {
    background: #ed8936;
    color: #fff;
  }
  .btn-warning:hover:not(:disabled) { background: #dd6b20; }
  .btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  /* ===== 历史记录区 ===== */
  .history-list {
    list-style: none;
  }
  .history-item {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    border-radius: 8px;
    margin-bottom: 8px;
    background: #f7fafc;
    font-size: 0.9rem;
    gap: 10px;
    flex-wrap: wrap;
  }
  .history-item .round-num {
    font-weight: 700;
    color: #718096;
    min-width: 40px;
  }
  .history-item .question-text {
    flex: 1;
    color: #2d3748;
    min-width: 160px;
  }
  .history-item .answer {
    font-weight: 700;
    padding: 2px 10px;
    border-radius: 12px;
    font-size: 0.85rem;
  }
  .answer-yes { background: #c6f6d5; color: #22543d; }
  .answer-no { background: #fed7d7; color: #742a2a; }

  .empty-hint {
    text-align: center;
    color: #a0aec0;
    font-size: 0.9rem;
    padding: 20px 0;
  }

  /* ===== 猜答案区 ===== */
  .guess-area {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .guess-row {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }

  /* ===== 结果提示 ===== */
  .result-banner {
    text-align: center;
    padding: 16px;
    border-radius: 10px;
    font-size: 1.1rem;
    font-weight: 700;
    margin-bottom: 16px;
  }
  .result-win { background: #c6f6d5; color: #22543d; }
  .result-lose { background: #fed7d7; color: #742a2a; }

  /* ===== 复盘表格 ===== */
  .review-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 0.88rem;
  }
  .review-table th, .review-table td {
    padding: 10px 8px;
    text-align: center;
    border-bottom: 1px solid #e2e8f0;
  }
  .review-table th {
    background: #edf2f7;
    color: #2d3748;
    font-weight: 600;
  }
  .review-table .lie-row {
    background: #fffaf0;
  }
  .lie-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 0.78rem;
    font-weight: 700;
  }
  .lie-yes { background: #feebc8; color: #7b341e; }
  .lie-no { background: #e2e8f0; color: #4a5568; }

  /* ===== 推理过程 ===== */
  .reasoning-box {
    background: #f0fff4;
    border-left: 4px solid #48bb78;
    padding: 14px 16px;
    border-radius: 0 8px 8px 0;
    margin-top: 14px;
    font-size: 0.9rem;
  }
  .reasoning-box h3 {
    font-size: 0.95rem;
    color: #22543d;
    margin-bottom: 8px;
  }
  .reasoning-box p {
    color: #2d3748;
    margin-bottom: 6px;
  }
  .reasoning-box .door-check {
    display: inline-block;
    margin: 2px 6px 2px 0;
    padding: 2px 8px;
    border-radius: 6px;
    font-size: 0.82rem;
    font-weight: 600;
  }
  .door-possible { background: #c6f6d5; color: #22543d; }
  .door-impossible { background: #fed7d7; color: #742a2a; text-decoration: line-through; }

  /* ===== 重新开始按钮 ===== */
  .restart-area {
    text-align: center;
    margin-top: 8px;
  }

  /* ===== 移动端适配 ===== */
  @media (max-width: 480px) {
    body { padding: 10px; }
    .card { padding: 14px; }
    h1 { font-size: 1.3rem; }
    .select-row label { min-width: auto; }
    select { min-width: 70px; padding: 7px 10px; }
    .btn { padding: 9px 18px; font-size: 0.9rem; }
    .review-table { font-size: 0.8rem; }
    .review-table th, .review-table td { padding: 8px 4px; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>🚪 逻辑猜门游戏</h1>

  <!-- ===== 游戏说明区 ===== -->
  <div class="card rules">
    <h2>📖 游戏说明</h2>
    <p>1. 共有 <strong>4 扇门</strong>（1、2、3、4），其中一扇是通关门。</p>
    <p>2. 你可以提问 <strong>5 次</strong>，每次选两扇门，问"X 和 Y 里面有没有通关门？"</p>
    <p>3. 系统回答【是】或【不是】，但<span class="highlight">恰好说谎 1 次</span>，其余 4 次全是真话。</p>
    <p>4. 根据 5 轮回答推理出通关门，提交你的猜测！</p>
  </div>

  <!-- ===== 提问选择区 ===== -->
  <div class="card">
    <h2>❓ 提问区</h2>
    <div class="status-bar">
      <span class="status-tag tag-questions" id="questionCount">已提问 0 / 5</span>
      <span class="status-tag tag-phase" id="phaseTag">提问阶段</span>
    </div>
    <div class="question-area">
      <div class="select-row">
        <label>门 A：</label>
        <select id="doorA">
          <option value="1">1 号门</option>
          <option value="2">2 号门</option>
          <option value="3">3 号门</option>
          <option value="4">4 号门</option>
        </select>
        <label>门 B：</label>
        <select id="doorB">
          <option value="1">1 号门</option>
          <option value="2" selected>2 号门</option>
          <option value="3">3 号门</option>
          <option value="4">4 号门</option>
        </select>
      </div>
      <div>
        <button class="btn btn-primary" id="askBtn" onclick="askQuestion()">提 问</button>
      </div>
    </div>
  </div>

  <!-- ===== 历史回答记录区 ===== -->
  <div class="card">
    <h2>📋 历史回答记录</h2>
    <ul class="history-list" id="historyList">
      <li class="empty-hint">暂无提问记录，开始你的第一次提问吧！</li>
    </ul>
  </div>

  <!-- ===== 猜答案提交区 ===== -->
  <div class="card">
    <h2>🎯 提交猜测</h2>
    <div class="guess-area">
      <div class="guess-row">
        <label style="font-size:0.9rem;color:#4a5568;font-weight:500;">选择门：</label>
        <select id="guessDoor" disabled>
          <option value="1">1 号门</option>
          <option value="2">2 号门</option>
          <option value="3">3 号门</option>
          <option value="4">4 号门</option>
        </select>
        <button class="btn btn-success" id="guessBtn" onclick="submitGuess()" disabled>提交猜测</button>
      </div>
      <p style="font-size:0.82rem;color:#a0aec0;" id="guessHint">完成 5 次提问后解锁猜答案</p>
    </div>
  </div>

  <!-- ===== 结果复盘区（默认隐藏） ===== -->
  <div class="card" id="reviewCard" style="display:none;">
    <h2>🔍 结果复盘</h2>
    <div id="resultBanner"></div>
    <div id="reviewContent"></div>
    <div class="restart-area">
      <button class="btn btn-warning" onclick="restartGame()">🔄 重新开始</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// 游戏状态管理
// ============================================================
let gameState = {
  correctDoor: 0,       // 正确通关门 (1-4)
  lieRound: 0,          // 说谎的轮次 (1-5)
  questionsAsked: 0,    // 已提问次数
  history: [],          // 历史记录 [{round, doorA, doorB, realAnswer, systemAnswer, isLie}]
  gameOver: false,      // 游戏是否结束
  playerGuess: null     // 玩家猜测
};

// ============================================================
// 初始化 / 重新开始游戏
// ============================================================
function initGame() {
  // 随机生成正确门 (1-4)
  gameState.correctDoor = Math.floor(Math.random() * 4) + 1;
  // 随机选定说谎轮次 (1-5)
  gameState.lieRound = Math.floor(Math.random() * 5) + 1;
  gameState.questionsAsked = 0;
  gameState.history = [];
  gameState.gameOver = false;
  gameState.playerGuess = null;

  // 重置UI
  document.getElementById('doorA').value = '1';
  document.getElementById('doorB').value = '2';
  document.getElementById('guessDoor').value = '1';
  document.getElementById('askBtn').disabled = false;
  document.getElementById('doorA').disabled = false;
  document.getElementById('doorB').disabled = false;
  document.getElementById('guessBtn').disabled = true;
  document.getElementById('guessDoor').disabled = true;
  document.getElementById('guessHint').textContent = '完成 5 次提问后解锁猜答案';
  document.getElementById('reviewCard').style.display = 'none';
  document.getElementById('phaseTag').textContent = '提问阶段';
  document.getElementById('phaseTag').className = 'status-tag tag-phase';

  updateQuestionCount();
  renderHistory();
}

// ============================================================
// 更新提问计数显示
// ============================================================
function updateQuestionCount() {
  document.getElementById('questionCount').textContent =
    `已提问 ${gameState.questionsAsked} / 5`;
}

// ============================================================
// 提问逻辑
// ============================================================
function askQuestion() {
  if (gameState.gameOver) return;
  if (gameState.questionsAsked >= 5) return;

  const doorA = parseInt(document.getElementById('doorA').value);
  const doorB = parseInt(document.getElementById('doorB').value);

  // 校验：两扇门不能相同
  if (doorA === doorB) {
    alert('请选择两扇不同的门！');
    return;
  }

  const currentRound = gameState.questionsAsked + 1;

  // 计算真实答案：正确门是否在 {doorA, doorB} 中
  const realAnswer = (gameState.correctDoor === doorA || gameState.correctDoor === doorB);

  // 判断当前轮是否为说谎轮
  const isLie = (currentRound === gameState.lieRound);

  // 系统回答：说谎轮输出相反答案
  const systemAnswer = isLie ? !realAnswer : realAnswer;

  // 记录历史
  gameState.history.push({
    round: currentRound,
    doorA: doorA,
    doorB: doorB,
    realAnswer: realAnswer,
    systemAnswer: systemAnswer,
    isLie: isLie
  });

  gameState.questionsAsked++;
  updateQuestionCount();
  renderHistory();

  // 5次提问用完，解锁猜答案
  if (gameState.questionsAsked >= 5) {
    document.getElementById('askBtn').disabled = true;
    document.getElementById('doorA').disabled = true;
    document.getElementById('doorB').disabled = true;
    document.getElementById('guessBtn').disabled = false;
    document.getElementById('guessDoor').disabled = false;
    document.getElementById('guessHint').textContent = '5 次提问已用完，请提交你的猜测！';
    document.getElementById('phaseTag').textContent = '猜测阶段';
  }
}

// ============================================================
// 渲染历史记录
// ============================================================
function renderHistory() {
  const list = document.getElementById('historyList');

  if (gameState.history.length === 0) {
    list.innerHTML = '<li class="empty-hint">暂无提问记录，开始你的第一次提问吧！</li>';
    return;
  }

  list.innerHTML = gameState.history.map(item => {
    const answerText = item.systemAnswer ? '是' : '不是';
    const answerClass = item.systemAnswer ? 'answer-yes' : 'answer-no';
    return `
      <li class="history-item">
        <span class="round-num">第${item.round}轮</span>
        <span class="question-text">${item.doorA} 和 ${item.doorB} 里有通关门吗？</span>
        <span class="answer ${answerClass}">${answerText}</span>
      </li>
    `;
  }).join('');
}

// ============================================================
// 提交猜测
// ============================================================
function submitGuess() {
  if (gameState.gameOver) return;
  if (gameState.questionsAsked < 5) return;

  const guess = parseInt(document.getElementById('guessDoor').value);
  gameState.playerGuess = guess;
  gameState.gameOver = true;

  showReview();
}

// ============================================================
// 展示复盘
// ============================================================
function showReview() {
  const isWin = (gameState.playerGuess === gameState.correctDoor);

  // 结果横幅
  const banner = document.getElementById('resultBanner');
  if (isWin) {
    banner.innerHTML = `<div class="result-banner result-win">🎉 恭喜你猜对了！通关门就是 ${gameState.correctDoor} 号门</div>`;
  } else {
    banner.innerHTML = `<div class="result-banner result-lose">😢 很遗憾猜错了。你猜的是 ${gameState.playerGuess} 号门，正确通关门是 ${gameState.correctDoor} 号门</div>`;
  }

  // 复盘表格
  let tableHTML = `
    <table class="review-table">
      <thead>
        <tr>
          <th>轮次</th>
          <th>提问（门A & 门B）</th>
          <th>真实答案</th>
          <th>系统回答</th>
          <th>是否说谎</th>
        </tr>
      </thead>
      <tbody>
  `;

  gameState.history.forEach(item => {
    const realText = item.realAnswer ? '是' : '不是';
    const sysText = item.systemAnswer ? '是' : '不是';
    const lieClass = item.isLie ? 'lie-yes' : 'lie-no';
    const lieText = item.isLie ? '说谎' : '真话';
    const rowClass = item.isLie ? 'lie-row' : '';
    tableHTML += `
      <tr class="${rowClass}">
        <td>第${item.round}轮</td>
        <td>${item.doorA} & ${item.doorB}</td>
        <td>${realText}</td>
        <td><strong>${sysText}</strong></td>
        <td><span class="lie-badge ${lieClass}">${lieText}</span></td>
      </tr>
    `;
  });

  tableHTML += `
      </tbody>
    </table>
    <p style="margin-top:10px;font-size:0.88rem;color:#718096;">
      💡 系统在 <strong>第 ${gameState.lieRound} 轮</strong> 说了谎。
    </p>
  `;

  // 推理过程
  tableHTML += generateReasoning();

  document.getElementById('reviewContent').innerHTML = tableHTML;
  document.getElementById('reviewCard').style.display = 'block';

  // 滚动到复盘区
  document.getElementById('reviewCard').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ============================================================
// 生成推理过程
// 逻辑：对每扇候选门，检查是否存在一个谎言位使得所有回答自洽
// ============================================================
function generateReasoning() {
  const doors = [1, 2, 3, 4];
  const possibleDoors = [];
  const impossibleDoors = [];
  const reasoningDetails = {};

  doors.forEach(door => {
    // 对这扇门作为正确门，检查每一轮的真实答案
    // 真实答案 = 该门是否在提问的两扇门中
    // 如果系统回答与真实答案不一致，该轮必须是谎言
    // 恰好有1个谎言 → 不一致的轮次必须恰好为1
    let mismatchRounds = [];
    gameState.history.forEach(item => {
      const realForThisDoor = (door === item.doorA || door === item.doorB);
      if (realForThisDoor !== item.systemAnswer) {
        mismatchRounds.push(item.round);
      }
    });

    reasoningDetails[door] = {
      mismatchRounds: mismatchRounds,
      possible: mismatchRounds.length === 1
    };

    if (mismatchRounds.length === 1) {
      possibleDoors.push(door);
    } else {
      impossibleDoors.push(door);
    }
  });

  // 构建推理文本
  let html = '<div class="reasoning-box">';
  html += '<h3>🧠 推理过程</h3>';
  html += '<p>规则：系统恰好说谎 1 次。对每扇候选门，假设它是正确门，逐轮比对"真实答案"与"系统回答"，不一致的轮次即为谎言。<strong>只有不一致轮次恰好为 1 的门才可能是正确门。</strong></p>';

  // 逐门分析
  doors.forEach(door => {
    const detail = reasoningDetails[door];
    const statusClass = detail.possible ? 'door-possible' : 'door-impossible';
    const statusText = detail.possible ? '可能' : '排除';
    let mismatchText = '';
    if (detail.mismatchRounds.length === 0) {
      mismatchText = '0 轮不一致（需要恰好1次谎言，不满足）';
    } else if (detail.mismatchRounds.length === 1) {
      mismatchText = `第 ${detail.mismatchRounds[0]} 轮不一致（即谎言在第${detail.mismatchRounds[0]}轮）`;
    } else {
      mismatchText = `第 ${detail.mismatchRounds.join('、')} 轮不一致（超过1次谎言，不可能）`;
    }
    html += `<p><span class="door-check ${statusClass}">${door}号门：${statusText}</span> ${mismatchText}</p>`;
  });

  // 结论
  html += '<p style="margin-top:10px;font-weight:600;">';
  if (possibleDoors.length === 1) {
    html += `✅ 结论：唯一可能的通关门是 <strong>${possibleDoors[0]} 号门</strong>。`;
  } else if (possibleDoors.length > 1) {
    html += `⚠️ 注意：当前提问组合下，${possibleDoors.map(d => d + '号门').join('、')} 均有可能（信息不足），需要运气或更优的提问策略。`;
  } else {
    html += `❌ 逻辑异常：没有门满足条件（不应出现）。`;
  }
  html += '</p>';
  html += '</div>';

  return html;
}

// ============================================================
// 重新开始
// ============================================================
function restartGame() {
  initGame();
  // 滚动到顶部
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// ============================================================
// 页面加载完成后初始化游戏
// ============================================================
window.onload = function() {
  initGame();
};
</script>
</body>
</html>
